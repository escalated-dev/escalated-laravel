version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # Deferred majors: Pest 5 and DomCrawler 8 need a planned upgrade.
      - dependency-name: "pestphp/pest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pestphp/pest-plugin-laravel"
        update-types: ["version-update:semver-major"]
      - dependency-name: "symfony/dom-crawler"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"


  - package-ecosystem: "npm"
    directory: "/docker/host-app"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
