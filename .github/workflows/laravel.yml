name: run-tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least-privilege GITHUB_TOKEN: the test job only needs to read the repo.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.2]
        laravel: [^12.0, ^11.0]
        include:
          - laravel: ^12.0
            testbench: 10.*
            pest: ^3.0
            pest-laravel: ^3.0
          - laravel: ^11.0
            testbench: 9.*
            pest: ^3.0
            pest-laravel: ^3.0
          # Minimum version for queue cleanup, middleware ordering, pivot
          # ownership and translation loader APIs used by the package.
          - php: '8.3'
            laravel: 11.39.0
            testbench: 9.*
            pest: ^3.0
            pest-laravel: ^3.0
          - php: '8.3'
            laravel: ^13.0
            testbench: 11.*
            pest: ^4.4.1
            pest-laravel: ^4.0
          - php: '8.5'
            laravel: ^13.0
            testbench: 11.*
            pest: ^4.4.1
            pest-laravel: ^4.0
          # Keep the merchant host's exact framework version covered, not just
          # the newest compatible 13.x. Composer selects compatible Testbench.
          - php: '8.3'
            laravel: 13.8.0
            testbench: 11.*
            pest: ^4.4.1
            pest-laravel: ^4.0

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest-laravel }}" --dev --no-interaction --no-update
          # Historical Laravel only overrides Console::add; Symfony 7.4's lazy
          # loader uses addCommand and skips its container injection entirely.
          if [ "${{ matrix.laravel }}" = "11.39.0" ]; then
            composer require "symfony/console:~7.3.0" --dev --no-interaction --no-update
          fi
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest

  separate-database:
    name: L${{ matrix.laravel }} - separate host and package databases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: ^12.0
            testbench: 10.*
            pest: ^3.0
            pest-laravel: ^3.0
          - laravel: ^13.0
            testbench: 11.*
            pest: ^4.4.1
            pest-laravel: ^4.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest-laravel }}" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute the complete suite with two independent databases
        env:
          ESCALATED_TEST_SEPARATE_CONNECTION: '1'
        run: vendor/bin/pest

  # The version matrix above runs on SQLite. These two legs run the same suite
  # against the engines hosts actually deploy on. The three disagree about
  # enough to matter -- LIKE case sensitivity, aggregate return types, and
  # SQLite's habit of reading an unknown double-quoted column as a string
  # literal instead of failing -- so a suite that has only ever seen SQLite has
  # never tested any of it.
  #
  # Both service containers start on both legs. GitHub Actions cannot make a
  # service conditional, and an empty `image:` is an error rather than a skip;
  # a spare container is cheaper than the confusion of working around it.
  databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]

    name: pest - ${{ matrix.db }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: escalated_test
        ports:
          - 3306:3306
        # The suite repeatedly rebuilds its disposable schemas. Keeping the
        # data directory in bounded RAM avoids host-disk fsync costs per DDL.
        options: >-
          --tmpfs /var/lib/mysql:rw,size=2g
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escalated_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # The package can be pointed at a connection of its own, and the suite
      # covers that with a second database rather than a second name for the
      # first.
      - name: Create the secondary database
        if: matrix.db == 'mysql'
        run: mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE IF NOT EXISTS escalated_test_secondary'

      - name: Create the secondary database
        if: matrix.db == 'pgsql'
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE escalated_test_secondary'

      - name: Execute tests
        env:
          # Read by tests/TestDatabase.php. An unrecognised value throws rather
          # than falling back, so a broken leg fails instead of quietly running
          # SQLite and reporting green.
          ESCALATED_TEST_DRIVER: ${{ matrix.db }}
          ESCALATED_TEST_PASSWORD: ${{ matrix.db == 'pgsql' && 'postgres' || '' }}
        run: vendor/bin/pest
